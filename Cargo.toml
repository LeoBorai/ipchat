[workspace]
default-members = [
    "src/server",
]
resolver = "3"
members = [
    "src/client",
    "src/server",
    "src/ui"
]

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8.6"
chrono = "0.4"
clap = "4.5"
console_error_panic_hook = "0.1"
console_log = "1"
futures-util = "0.3"
http = "1.3"
leptos = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
log = "0.4"
futures = "0.3"
gloo-net = "0.6"
gloo-timers = "0.3"
if-addrs = "0.14.0"
local-ip-address = "0.6.5"
mime_guess = "2.0"
reqwest = "0.12"
rust-embed = "8.9"
serde = "1.0"
serde_json = "1.0"
socket2 = "0.6.1"
tokio = "1.47"
tokio-tungstenite = "0.28.0"
tower-http = "0.6"
tracing-subscriber = "0.3"
tracing = "0.1.41"
utoipa = "5.4"
utoipa-swagger-ui = "9.0"
uuid = "1"
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"
web-sys = "0.3"

ipchat-client = { path = "src/client" }
